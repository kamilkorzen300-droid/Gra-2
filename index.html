<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strzelankapodmagazynami</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth">
  <h1>🔫 STRZELANKAPODMAGAZYNAMI</h1>
  <div class="auth-box">
    <h2 id="authTitle">Załóż konto</h2>
    <input id="nick" placeholder="Nick">
    <input id="password" type="password" placeholder="Hasło">
    <button onclick="register()">Załóż konto</button>
    <button onclick="login()">Zaloguj się</button>
    <p id="authMessage"></p>
  </div>
</div>

<div id="menu" hidden>
  <h1>STRZELANKAPODMAGAZYNAMI</h1>
  <h2>Witaj, <span id="playerName"></span>!</h2>
  <h3>🪙 <span id="coins">0</span> monet</h3>
  <button onclick="startGame()">GRAJ</button>
  <button onclick="openShop()">SKLEP</button>
  <button onclick="logout()">WYLOGUJ</button>
</div>

<div id="shop" hidden>
  <h1>🛒 SKLEP</h1>
  <h2>Monety: <span id="shopCoins">0</span></h2>
  <button onclick="buyWeapon()">Ulepsz broń – 100 monet</button>
  <button onclick="backMenu()">POWRÓT</button>
</div>

<div id="game" hidden>
  <div id="hud">
    <span>❤️ <b id="health">100</b></span>
    <span>🪙 <b id="gameCoins">0</b></span>
    <span>🌊 Fala: <b id="wave">1</b>/50</span>
    <span>🔫 <b id="weapon">Pistolet</b></span>
  </div>

  <canvas id="canvas"></canvas>

  <div id="controls">
    <button id="left">⬅️</button>
    <button id="up">⬆️</button>
    <button id="down">⬇️</button>
    <button id="right">➡️</button>
    <button id="shoot">🔫 STRZELAJ</button>
  </div>

  <button onclick="pauseGame()">PAUZA</button>
</div>

<div id="gameOver" hidden>
  <h1>KONIEC GRY</h1>
  <h2>Zdobyte monety: <span id="earned">0</span></h2>
  <button onclick="backMenu()">MENU</button>
  <button onclick="startGame()">ZAGRAJ PONOWNIE</button>
</div>

<script src="script.js"></script>
</body>
</html>
